services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 5s, retries: 12}

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadminpassword};
      mc mb myminio/$${AWS_STORAGE_BUCKET_NAME:-exam-platform} --ignore-existing;
      exit 0;
      "

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      minio: {condition: service_started}
    command: ["sh","-c","python manage.py migrate && python manage.py ensure_admin && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --reload --access-logfile -"]
    volumes: [".:/app", media_data:/app/media]
    ports: ["8000:8000"]

volumes: {postgres_data: {}, media_data: {}, minio_data: {}}

