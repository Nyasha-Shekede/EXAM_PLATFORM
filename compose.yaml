services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 5s, retries: 12}
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: {db: {condition: service_healthy}}
    command: ["sh","-c","python manage.py migrate && if [ \"$${AUTO_SEED}\" = \"1\" ]; then python manage.py seed_demo; fi && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --reload --access-logfile -"]
    volumes: [".:/app", media_data:/app/media]
    ports: ["8000:8000"]
volumes: {postgres_data: {}, media_data: {}}
