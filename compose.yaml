# Local Docker evaluation only. Create an ignored .env as documented in README.md.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    volumes: [minio_data:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

  createbuckets:
    image: minio/mc:latest
    env_file: .env
    depends_on:
      minio: {condition: service_started}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        n=0
        until mc ready local; do
          n=$$((n + 1))
          if [ "$$n" -ge 30 ]; then exit 1; fi
          sleep 2
        done
        mc mb "local/$${AWS_STORAGE_BUCKET_NAME}" --ignore-existing
        mc anonymous set none "local/$${AWS_STORAGE_BUCKET_NAME}"

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      createbuckets: {condition: service_completed_successfully}
    volumes: [media_data:/app/media]
    ports: ["127.0.0.1:8000:8000"]

volumes:
  postgres_data: {}
  media_data: {}
  minio_data: {}
