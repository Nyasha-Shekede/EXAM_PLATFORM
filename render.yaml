# ==============================================================================
# Render Infrastructure Blueprint (render.yaml)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: exam-platform
    runtime: docker
    plan: free # Evaluation only; choose a current paid plan for production.
    region: frankfurt # Or oregon, ohio, singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: exam-platform-db
          property: connectionString
      - key: TIME_ZONE
        value: Africa/Harare
      - key: SITE_NAME
        value: Africa Drone Kings
      - key: SUPPORT_EMAIL
        value: training@africadronekings.com
      # Create the first administrator explicitly with `createsuperuser` in the service shell.
      - key: PUBLIC_SIGNUP
        value: "1"
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: CSRF_COOKIE_SECURE
        value: "1"
      # Required: verified Resend domain and API key
      - key: RESEND_API_KEY
        sync: false # Prompts you to fill in your key in Render dashboard
      - key: DEFAULT_FROM_EMAIL
        value: Africa Drone Kings <training@africadronekings.com>
      # Required for this blueprint: private object storage (S3-compatible)
      # Alternatively remove bucket variables, attach a disk, and set MEDIA_ROOT to its mount.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false

databases:
  - name: exam-platform-db
    plan: free # Evaluation only; verify retention/expiry and pricing before applying.
    region: frankfurt
    databaseName: drone_exams
    user: postgres
