{% extends "base.html" %}
{% load static %}

{% block title %}Sign In · Africa Drone Kings{% endblock %}

{% block header %}{% endblock %}

{% block content %}
<section class="login-card">
  <div class="login-header" style="margin-bottom: 2rem;">
    <img src="{% static 'img/adk-logo.png' %}" alt="Africa Drone Kings" class="login-logo" style="height: 60px;">
  </div>
  <form method="post" class="stack">
    {% csrf_token %}
    {% if form.non_field_errors %}
    <div class="notice error">{{ form.non_field_errors }}</div>
    {% endif %}
    <label>
      Username or Email
      {{ form.username }}
    </label>
    <label>
      Password
      {{ form.password }}
    </label>
    <button class="primary" type="submit" style="margin-top: 0.5rem; padding: 0.9rem;">Sign In to Examination Portal</button>
  </form>
</section>
{% endblock %}
